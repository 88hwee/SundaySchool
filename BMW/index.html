<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bible Memorization: Super Jump</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
            --sar: env(safe-area-inset-right);
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body { 
            margin: 0; 
            background: #5c94fc;
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            color: white; 
            touch-action: none; 
            height: 100dvh;
            width: 100vw;
            position: fixed;
        }
        
        #game-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
        }

        canvas { 
            display: block; 
            width: 100%;
            height: 100%;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        .option-btn:active {
            transform: scale(0.98);
        }

        /* Responsive typography and layout handling */
        .option-btn {
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.25rem 0.5rem;
            width: 100%;
            height: 100%; /* Fill the grid slot perfectly */
            min-height: 0; /* Prevents grid blowout */
            border-radius: 12px;
            font-weight: 700;
            /* Combines vw and dvh so text shrinks if screen is narrow OR short */
            font-size: min(3.5vw, 2.2dvh); 
            line-height: 1.15;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            border: 3px solid #3b82f6;
            word-break: normal;
            overflow-wrap: break-word;
            overflow: hidden; /* Prevent spillover */
        }

        .zh-text-dark {
            font-size: min(4.5vw, 2.8dvh); /* Bolder/larger Chinese relative to height/width */
            color: #1e3a8a; /* blue-900 */
            margin-top: 4px;
            font-weight: 900;
            line-height: 1.2;
        }

        /* Enhancements for iPad and Laptops */
        @media (min-width: 768px) {
            .option-btn { 
                padding: 0.75rem 1rem; 
                border-radius: 20px; 
                border-width: 4px; 
                font-size: min(1.8vw, 2.2dvh);
                box-shadow: 0 6px 0 rgba(0,0,0,0.2); 
            }
            .zh-text-dark {
                font-size: min(2.2vw, 2.8dvh);
                margin-top: 6px;
            }
        }

        #options-container {
            align-content: stretch; /* Forces buttons to share vertical space equally */
            grid-auto-rows: minmax(0, 1fr); /* Crucial: strictly bounds row height so it fits in the screen */
            gap: 0.5rem;
        }
        @media (min-width: 768px) {
            #options-container {
                gap: 1rem;
            }
        }

        #hud {
            padding-top: calc(0.5rem + var(--sat));
            padding-left: calc(1rem + var(--sal));
            padding-right: calc(1rem + var(--sar));
        }

        .pixel-text {
            text-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen" class="absolute inset-0 z-[110] flex flex-col items-center justify-center p-6 text-center bg-[#5c94fc]">
        <div class="mb-6 bg-white p-6 rounded-[40px] shadow-2xl rotate-[-2deg] border-8 border-yellow-400">
            <h1 class="text-4xl md:text-6xl font-black text-blue-900 italic tracking-tighter uppercase">Bible Master Jump</h1>
        </div>
        <p class="text-white font-black text-xl tracking-widest mb-8 md:mb-10 uppercase pixel-text">A-Z MEMORIZATION</p>
        
        <div class="mb-8 md:mb-10 text-white text-sm space-y-3 md:space-y-4 max-w-md bg-white/20 p-6 md:p-8 rounded-[40px] border-4 border-white/40">
            <p class="font-bold">Jump into <span class="text-yellow-300 font-black">? BLOCKS</span> from below to reveal verses!</p>
            <p>Right answers shoot <span class="text-green-300 font-black">Fireworks</span> 🎆</p>
            <p>Wrong answers open a <span class="text-red-400 font-black">Pit</span> below you 🕳️</p>
            <p class="text-[10px] md:text-xs font-black uppercase bg-blue-800/50 py-3 rounded-2xl mt-4">Computer: Arrows & Space | Mobile: Screen Buttons</p>
        </div>

        <button id="btn-start" class="px-12 md:px-20 py-6 md:py-8 bg-yellow-400 text-blue-900 font-black rounded-full shadow-[0_12px_0_#ca8a04] hover:shadow-[0_6px_0_#ca8a04] hover:translate-y-1 uppercase tracking-widest text-xl md:text-2xl transition-all border-4 border-white">
            START MEMORIZING
        </button>
    </div>

    <div id="hud" class="absolute top-0 left-0 w-full flex justify-between items-start pointer-events-none z-20">
        <div class="bg-black/30 backdrop-blur-md px-3 md:px-5 py-2 md:py-3 rounded-3xl border-2 border-white/20">
            <p class="text-[9px] md:text-[10px] uppercase font-black text-white/70">Lives</p>
            <p id="stats-lives" class="text-lg md:text-2xl font-black text-red-500">❤️❤️❤️❤️❤️</p>
        </div>
        <div class="bg-black/30 backdrop-blur-md px-4 md:px-8 py-2 md:py-3 rounded-3xl border-2 border-white/20 text-center">
            <p class="text-[9px] md:text-[10px] uppercase font-black text-white/70">Time Remaining</p>
            <p id="stats-timer" class="text-lg md:text-2xl font-black text-yellow-300">180s</p>
        </div>
        <div class="bg-black/30 backdrop-blur-md px-3 md:px-5 py-2 md:py-3 rounded-3xl border-2 border-white/20 text-right">
            <p class="text-[9px] md:text-[10px] uppercase font-black text-white/70">Score</p>
            <p id="stats-score" class="text-lg md:text-2xl font-black text-green-400">0</p>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="quiz-overlay" class="hidden absolute inset-0 z-[150] flex items-center justify-center p-3 md:p-6 bg-black/85 backdrop-blur-sm">
        <!-- Strict height bounds h-[94dvh] to force the grid to squeeze content instead of expanding container -->
        <div class="w-full max-w-5xl bg-white border-[6px] md:border-8 border-yellow-400 rounded-[24px] md:rounded-[40px] p-4 md:p-8 shadow-2xl flex flex-col h-[94dvh]">
            
            <div class="flex justify-between items-center mb-2 md:mb-4 shrink-0">
                <span class="bg-blue-600 text-white text-[10px] md:text-[14px] px-3 md:px-5 py-1 md:py-2 rounded-full font-black uppercase tracking-widest">Verse Challenge</span>
            </div>
            
            <h3 id="question-text" class="text-[min(4.5vw,2.5dvh)] md:text-[min(2.5vw,3dvh)] font-black mb-3 md:mb-6 text-blue-900 leading-tight shrink-0"></h3>
            
            <!-- Options grid: grid-cols-1 on mobile/iPad portrait, 2 cols on laptops (lg). grid-auto-rows strictly controls height -->
            <div id="options-container" class="grid grid-cols-1 lg:grid-cols-2 flex-grow min-h-0"></div>
            
            <!-- Feedback area replaces options -->
            <div id="feedback-area" class="hidden mt-4 md:mt-8 p-4 md:p-8 rounded-[20px] md:rounded-[30px] border-4 text-center shrink-0">
                <p id="feedback-title" class="font-black uppercase text-xl md:text-3xl mb-2"></p>
                <p id="feedback-detail" class="text-sm md:text-xl text-blue-900 font-bold"></p>
            </div>
        </div>
    </div>

    <div id="end-screen" class="hidden absolute inset-0 z-[200] flex flex-col items-center justify-center p-6 text-center bg-blue-600">
        <div class="mb-6 md:mb-8 bg-white p-4 md:p-6 rounded-[30px] md:rounded-[40px] shadow-2xl border-8 border-yellow-400">
            <h2 id="end-status" class="text-4xl md:text-6xl font-black italic uppercase tracking-tighter text-blue-900"></h2>
        </div>
        <div class="mb-10 md:mb-12">
            <p class="text-white font-black uppercase tracking-widest mb-4 pixel-text">Final Score</p>
            <div class="text-[6rem] md:text-[10rem] leading-none font-black text-yellow-300 drop-shadow-[0_15px_0_rgba(0,0,0,0.3)]" id="final-score">0</div>
        </div>
        <button id="btn-restart" class="px-12 md:px-20 py-6 md:py-8 bg-yellow-400 text-blue-900 font-black rounded-full shadow-[0_12px_0_#ca8a04] uppercase tracking-widest text-xl md:text-2xl transition-all active:translate-y-1 active:shadow-none border-4 border-white">
            PLAY AGAIN
        </button>
    </div>

    <div class="absolute inset-0 pointer-events-none z-30">
        <div class="absolute bottom-6 md:bottom-10 left-6 md:left-10 flex gap-4 md:gap-6 pointer-events-auto">
            <div id="ctrl-left" class="control-btn w-20 h-20 md:w-24 md:h-24">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M15 19l-7-7 7-7"/></svg>
            </div>
            <div id="ctrl-right" class="control-btn w-20 h-20 md:w-24 md:h-24">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M9 5l7 7-7 7"/></svg>
            </div>
        </div>
        <div class="absolute bottom-6 md:bottom-10 right-6 md:right-10 pointer-events-auto">
            <div id="ctrl-jump" class="control-btn w-24 h-24 md:w-32 md:h-32 bg-yellow-400/30 border-yellow-400 shadow-xl">
                <div class="text-white font-black text-xl md:text-4xl italic">JUMP</div>
            </div>
        </div>
    </div>
</div>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let upcomingQuestions = [];
let currentQ = null;

let state = {
    gameStarted: false,
    gameActive: false,
    paused: false,
    timer: 180,
    lives: 5,
    score: 0,
    viewportW: window.innerWidth,
    viewportH: window.innerHeight,
    groundY: 0,
    cameraX: 0,
    pit: { active: false, x: 0, w: 280 }
};

const player = { 
    x: 200, y: 0, w: 50, h: 75,
    vx: 0, vy: 0, 
    speed: 8, jumpPower: -18, 
    grounded: false, facingRight: true,
    jumpsAvailable: 2,
    frame: 0
};

let blocks = [];
let particles = [];
const inputs = { left: false, right: false };

function shuffle(a) {
    let array = [...a];
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function generateQuestion() {
    let target = BIBLE_DATA[Math.floor(Math.random() * BIBLE_DATA.length)];
    let distractors = [];
    
    while (distractors.length < 3) {
        let d = BIBLE_DATA[Math.floor(Math.random() * BIBLE_DATA.length)];
        if (d.ref !== target.ref && !distractors.find(x => x.ref === d.ref)) {
            distractors.push(d);
        }
    }
    
    // 6 Different Play Modes!
    let mode = Math.floor(Math.random() * 6);
    let qText = "";
    let options = [];
    let correctStr = "";

    if (mode === 0) {
        qText = `Find the verse for:<br><span class="text-blue-600">${target.ref}</span><br><div class="zh-text-dark">${target.refZh}</div>`;
        correctStr = `${target.text}<div class="zh-text-dark">${target.textZh}</div>`;
        options.push(correctStr);
        distractors.forEach(d => options.push(`${d.text}<div class="zh-text-dark">${d.textZh}</div>`));
    } 
    else if (mode === 1) {
        qText = `Which verse is this?<br><div class="text-[0.8em] font-normal mt-2 leading-snug">${target.text}</div><div class="zh-text-dark">${target.textZh}</div>`;
        correctStr = `${target.ref}<div class="zh-text-dark">${target.refZh}</div>`;
        options.push(correctStr);
        distractors.forEach(d => options.push(`${d.ref}<div class="zh-text-dark">${d.refZh}</div>`));
    } 
    else if (mode === 2) {
        qText = `Complete the verse:<br><div class="text-[0.8em] font-normal mt-2 text-gray-700 leading-snug">${target.h1} <strong>_____</strong></div><div class="zh-text-dark">${target.h1Zh} <strong>_____</strong></div>`;
        correctStr = `${target.h2}<div class="zh-text-dark">${target.h2Zh}</div>`;
        options.push(correctStr);
        distractors.forEach(d => options.push(`${d.h2}<div class="zh-text-dark">${d.h2Zh}</div>`));
    }
    else if (mode === 3) {
        qText = `Fill in the beginning:<br><div class="text-[0.8em] font-normal mt-2 text-gray-700 leading-snug"><strong>_____</strong> ${target.h2}</div><div class="zh-text-dark"><strong>_____</strong> ${target.h2Zh}</div>`;
        correctStr = `${target.h1}<div class="zh-text-dark">${target.h1Zh}</div>`;
        options.push(correctStr);
        distractors.forEach(d => options.push(`${d.h1}<div class="zh-text-dark">${d.h1Zh}</div>`));
    }
    else if (mode === 4) {
        let isTrue = Math.random() > 0.5;
        let displayVerse = isTrue ? target : distractors[0];
        qText = `True or False?<br><span class="text-blue-600">${target.ref}</span> <span class="text-[0.9em] font-black text-gray-700">(${target.refZh})</span><br>matches this text:<br><div class="text-[0.8em] font-normal mt-2 leading-snug">${displayVerse.text}</div><div class="zh-text-dark">${displayVerse.textZh}</div>`;
        
        correctStr = isTrue ? `True<div class="zh-text-dark">正确</div>` : `False<div class="zh-text-dark">错误</div>`;
        let wrongStr = isTrue ? `False<div class="zh-text-dark">错误</div>` : `True<div class="zh-text-dark">正确</div>`;
        options = [correctStr, wrongStr]; 
    }
    else if (mode === 5) {
        qText = `Who is the speaker or primary author of this verse?<br><div class="text-[0.8em] font-normal mt-2 leading-snug">${target.text}</div><div class="zh-text-dark">${target.textZh}</div>`;
        correctStr = `${target.author}<div class="zh-text-dark">${target.authorZh}</div>`;
        
        let authorDistractors = [];
        let allAuthors = [...new Set(BIBLE_DATA.map(d => JSON.stringify({e: d.author, z: d.authorZh})))].map(s => JSON.parse(s));
        let possibleDistractors = allAuthors.filter(a => a.e !== target.author);
        possibleDistractors = shuffle(possibleDistractors);
        
        for(let i = 0; i < Math.min(3, possibleDistractors.length); i++) {
            authorDistractors.push(`${possibleDistractors[i].e}<div class="zh-text-dark">${possibleDistractors[i].z}</div>`);
        }
        options = [correctStr, ...authorDistractors];
    }

    return { q: qText, a: correctStr, o: shuffle(options) };
}

function initBlocks() {
    blocks = [];
    for (let i = 0; i < 50; i++) {
        blocks.push({
            x: 600 + (i * 600),
            y: state.groundY - 240 - (Math.random() * 80),
            w: 80, h: 80,
            active: true,
            type: 'quiz'
        });
        
        if (Math.random() > 0.5) {
            blocks.push({
                x: 800 + (i * 600),
                y: state.groundY - 140,
                w: 80, h: 80,
                active: true,
                type: 'brick'
            });
        }
    }
}

function resize() {
    state.viewportW = window.innerWidth;
    state.viewportH = window.innerHeight;
    canvas.width = state.viewportW;
    canvas.height = state.viewportH;
    state.groundY = state.viewportH - 120;
    
    if (!state.gameStarted) {
        player.y = state.groundY - player.h;
        initBlocks();
    }
}

function handleJump() {
    if (!state.gameActive || state.paused) return;
    if (player.jumpsAvailable > 0) {
        player.vy = player.jumpPower;
        player.jumpsAvailable--;
        player.grounded = false;
    }
}

function init() {
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    resize();

    const handleKey = (e, isDown) => {
        if (!state.gameActive || state.paused) return;
        const key = e.key.toLowerCase();
        if (key === 'arrowleft' || key === 'a') inputs.left = isDown;
        if (key === 'arrowright' || key === 'd') inputs.right = isDown;
        if (isDown && (key === ' ' || key === 'w' || key === 'arrowup')) {
            e.preventDefault();
            handleJump();
        }
    };
    window.addEventListener('keydown', (e) => handleKey(e, true));
    window.addEventListener('keyup', (e) => handleKey(e, false));

    const setupTouch = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; }, {passive: false});
        el.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; }, {passive: false});
    };
    setupTouch('ctrl-left', 'left');
    setupTouch('ctrl-right', 'right');
    document.getElementById('ctrl-jump').addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); }, {passive: false});

    document.getElementById('btn-start').onclick = () => {
        document.getElementById('start-screen').classList.add('hidden');
        state.gameStarted = true;
        state.gameActive = true;
        window.focus(); 
    };

    document.getElementById('btn-restart').onclick = () => location.reload();
    requestAnimationFrame(update);
}

function triggerQuiz(block) {
    state.paused = true;
    
    // Spaced Repetition logic - retrieve delayed question if ready!
    let dueIndex = upcomingQuestions.findIndex(item => item.delay <= 0);
    if (dueIndex !== -1) {
        currentQ = upcomingQuestions[dueIndex].qObj;
        upcomingQuestions.splice(dueIndex, 1);
    } else {
        currentQ = generateQuestion();
    }

    const modal = document.getElementById('quiz-overlay');
    const container = document.getElementById('options-container');
    const feedback = document.getElementById('feedback-area');
    
    document.getElementById('question-text').innerHTML = currentQ.q;
    feedback.classList.add('hidden');
    container.classList.remove('hidden');
    container.innerHTML = '';
    
    currentQ.o.forEach(optHtml => {
        const btn = document.createElement('button');
        btn.className = 'option-btn bg-white text-blue-900 active:bg-yellow-400 border-b-[6px] border-blue-500 hover:border-blue-600'; 
        btn.innerHTML = optHtml;
        btn.onclick = () => {
            Array.from(container.children).forEach(b => b.disabled = true);
            
            // Advance delay for remaining scheduled repeat questions
            upcomingQuestions.forEach(item => item.delay--);

            if (optHtml === currentQ.a) {
                // Correct Answer - Fireworks!
                state.score += 500;
                document.getElementById('stats-score').innerText = state.score;
                
                feedback.classList.remove('hidden');
                container.classList.add('hidden');
                feedback.className = "mt-4 p-4 rounded-[20px] border-[6px] border-green-500 bg-green-100 text-center shrink-0";
                document.getElementById('feedback-title').innerText = "CORRECT!";
                document.getElementById('feedback-title').className = "font-black uppercase text-3xl mb-1 text-green-600";
                document.getElementById('feedback-detail').innerHTML = "Praise God! Keep going!";
                
                spawnFireworks(player.x + player.w/2, player.y);
                setTimeout(() => resume(), 1200);

            } else {
                // Wrong Answer - Pit Fall & Schedule Repeat
                upcomingQuestions.push({ qObj: currentQ, delay: 3 });
                
                feedback.classList.remove('hidden');
                container.classList.add('hidden');
                feedback.className = "mt-4 p-4 rounded-[20px] border-[6px] border-red-500 bg-red-100 text-center shrink-0";
                document.getElementById('feedback-title').innerText = "MISS!";
                document.getElementById('feedback-title').className = "font-black uppercase text-3xl mb-1 text-red-600";
                
                // Show corrected answer in a compact way
                document.getElementById('feedback-detail').innerHTML = `The correct answer was:<br><div class="mt-2 text-sm font-normal">${currentQ.a}</div>`;
                
                state.pit.active = true;
                state.pit.x = player.x - 115; // Center pit under player
                
                setTimeout(() => resume(), 2500);
            }
        };
        container.appendChild(btn);
    });
    modal.classList.remove('hidden');
}

function updateLivesHUD() {
    document.getElementById('stats-lives').innerText = '❤️'.repeat(Math.max(0, state.lives)) + '🖤'.repeat(Math.max(0, 5 - state.lives));
}

function resume() {
    document.getElementById('quiz-overlay').classList.add('hidden');
    state.paused = false;
}

function handleFallDeath() {
    state.lives--;
    updateLivesHUD();
    state.pit.active = false;
    
    if (state.lives <= 0) {
        endGame("GAME OVER", "You fell too many times!");
    } else {
        player.y = -100;
        player.x = Math.max(0, player.x - 300);
        player.vy = 0;
        player.grounded = false;
    }
}

function spawnFireworks(x, y) {
    const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ffffff'];
    for(let i=0; i<60; i++) {
        particles.push({
            x: x, y: y - 50,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 0.5) * 20 - 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1.0,
            decay: Math.random() * 0.02 + 0.015,
            size: Math.random() * 6 + 3
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function update() {
    if (state.gameStarted && state.gameActive && !state.paused) {
        if (inputs.right) { player.vx = player.speed; player.facingRight = true; player.frame += 0.25; }
        else if (inputs.left) { player.vx = -player.speed; player.facingRight = false; player.frame += 0.25; }
        else { player.vx *= 0.85; player.frame = 0; }

        player.vy += 1.0; 
        player.x += player.vx;
        player.y += player.vy;

        let isOverPit = false;
        if (state.pit.active) {
            if (player.x + player.w/2 > state.pit.x && player.x + player.w/2 < state.pit.x + state.pit.w) {
                isOverPit = true;
            }
        }

        if (player.y + player.h > state.groundY && !isOverPit) { 
            player.y = state.groundY - player.h;
            player.vy = 0; 
            player.grounded = true;
            player.jumpsAvailable = 2;
        } else if (player.y > state.viewportH + 100) {
            handleFallDeath();
        }

        blocks.forEach(b => {
            if (!b.active && b.type === 'quiz') return;
            
            if (player.x < b.x + b.w && player.x + player.w > b.x && 
                player.y < b.y + b.h && player.y + player.h > b.y) {
                
                if (player.vy < 0 && player.y > b.y + b.h - 35) {
                    player.vy = 5;
                    if (b.type === 'quiz' && b.active) {
                        b.active = false;
                        triggerQuiz(b);
                    }
                } 
                else if (player.vy > 0 && player.y + player.h < b.y + 35) {
                    player.y = b.y - player.h;
                    player.vy = 0;
                    player.grounded = true;
                    player.jumpsAvailable = 2;
                }
                else if (player.vx > 0 && player.x + player.w < b.x + 25) { player.x = b.x - player.w; }
                else if (player.vx < 0 && player.x > b.x + b.w - 25) { player.x = b.x + b.w; }
            }
        });

        if (player.x < 0) player.x = 0;
        
        let targetCamX = -player.x + (state.viewportW * 0.3);
        state.cameraX += (targetCamX - state.cameraX) * 0.15;
        if (state.cameraX > 0) state.cameraX = 0;
        
        updateParticles();
    }
    render();
    requestAnimationFrame(update);
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Background
    ctx.fillStyle = "#5c94fc";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    for(let i=0; i<20; i++) {
        ctx.beginPath(); 
        ctx.ellipse((300 + i*600) + (state.cameraX * 0.2), 150 + (i%3)*50, 80, 40, 0, 0, Math.PI*2); 
        ctx.fill();
    }
    
    ctx.save();
    ctx.translate(state.cameraX, 0);
    
    // Pit & Ground Logic
    if (state.pit.active) {
        ctx.fillStyle = "#88d800"; ctx.fillRect(-5000, state.groundY, 5000 + state.pit.x, 30);
        ctx.fillStyle = "#c84c0c"; ctx.fillRect(-5000, state.groundY + 30, 5000 + state.pit.x, 200);
        ctx.fillStyle = "#88d800"; ctx.fillRect(state.pit.x + state.pit.w, state.groundY, 60000, 30);
        ctx.fillStyle = "#c84c0c"; ctx.fillRect(state.pit.x + state.pit.w, state.groundY + 30, 60000, 200);
    } else {
        ctx.fillStyle = "#88d800"; ctx.fillRect(-5000, state.groundY, 60000, 30);
        ctx.fillStyle = "#c84c0c"; ctx.fillRect(-5000, state.groundY + 30, 60000, 200);
    }
    
    ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 4;
    for(let i=0; i<60; i++) {
        let lineX = i * 500;
        if (!state.pit.active || (lineX < state.pit.x || lineX > state.pit.x + state.pit.w)) {
            ctx.beginPath(); ctx.moveTo(lineX, state.groundY+30); ctx.lineTo(lineX, state.viewportH); ctx.stroke();
        }
    }

    // Blocks
    blocks.forEach(b => { 
        if (!b.active && b.type === 'quiz') {
            ctx.fillStyle = '#6b7280'; ctx.beginPath(); 
            if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, 12); else ctx.rect(b.x, b.y, b.w, b.h);
            ctx.fill(); ctx.strokeStyle = '#374151'; ctx.lineWidth = 6; ctx.stroke();
            return;
        }
        
        if (b.type === 'quiz') {
            ctx.fillStyle = '#fbbf24'; ctx.beginPath(); 
            if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, 12); else ctx.rect(b.x, b.y, b.w, b.h);
            ctx.fill(); ctx.strokeStyle = '#92400e'; ctx.lineWidth = 6; ctx.stroke();
            ctx.fillStyle = '#0f172a'; ctx.font = 'black 56px Inter'; ctx.textAlign = 'center';
            ctx.fillText('?', b.x + b.w/2, b.y + b.h/2 + 20);
        } else {
            ctx.fillStyle = '#c84c0c'; ctx.beginPath(); 
            if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, 6); else ctx.rect(b.x, b.y, b.w, b.h);
            ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.stroke();
        }
    });
    
    // Character
    ctx.save();
    ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
    if (!player.facingRight) ctx.scale(-1, 1);
    
    const walk = player.grounded ? Math.sin(player.frame * 2) * 6 : 0;
    ctx.fillStyle = "#ef4444"; ctx.fillRect(-25, -45 + walk, 50, 20);
    ctx.fillStyle = "#ffdbac"; ctx.fillRect(-20, -25 + walk, 40, 35);
    ctx.fillStyle = "#000"; ctx.fillRect(10, -15 + walk, 5, 5);
    ctx.fillStyle = "#ef4444"; ctx.fillRect(-22, 10 + walk, 44, 30);
    ctx.fillStyle = "#2563eb"; ctx.fillRect(-22, 25 + walk, 44, 15);
    
    let legY1 = 40, legY2 = 40;
    if (!player.grounded) { legY1 = 30; legY2 = 45; } else { legY1 = 40 - walk; legY2 = 40 + walk; }
    ctx.fillRect(-22, legY1, 18, 20);
    ctx.fillRect(4, legY2, 18, 20);
    ctx.restore();
    
    // Fireworks Particles
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    ctx.restore();
}

function endGame(status, msg) {
    state.gameActive = false;
    document.getElementById('end-status').innerText = status;
    document.getElementById('final-score').innerText = state.score;
    document.getElementById('end-screen').classList.remove('hidden');
}

setInterval(() => {
    if (state.gameActive && !state.paused && state.timer > 0) {
        state.timer--;
        document.getElementById('stats-timer').innerText = state.timer + "s";
        if (state.timer <= 0) endGame("TIME'S UP!", "Good effort!");
    }
}, 1000);

window.onload = init;
</script>
